name: Uygulamayı derle (indir-çalıştır)

# Etiket (v...) itilince Windows/Mac/Linux için tek dosyalık uygulamayı derler
# ve GitHub "Releases" sayfasına ekler. Manuel de çalıştırılabilir (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm etiketi (ör. v0.1.0)"
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
          - os: macos-latest
            sep: ":"
          - os: ubuntu-latest
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install -r requirements.txt pyinstaller

      - name: Yüksek doğruluklu Türkçe OCR modelini indir (tessdata_best)
        shell: bash
        run: |
          # Depoda "hızlı" model var (~4 MB). "En iyi" model (~15 MB) belirgin
          # şekilde daha az OCR hatası üretir; paketlenen uygulamaya onu koy.
          curl -sSL --retry 3 -o tessdata/tur_best.traineddata \
            https://github.com/tesseract-ocr/tessdata_best/raw/main/tur.traineddata || true
          if [ -s tessdata/tur_best.traineddata ]; then
            mv tessdata/tur_best.traineddata tessdata/tur.traineddata
            echo "tessdata_best kuruldu ($(wc -c < tessdata/tur.traineddata) bayt)"
          else
            rm -f tessdata/tur_best.traineddata
            echo "UYARI: tessdata_best indirilemedi, depodaki hızlı model kullanılacak"
          fi

      - name: Derle (tek dosya, pencereli; Türkçe OCR dil dosyası gömülü)
        run: pyinstaller --onefile --windowed --name KitapDonusturucu --collect-all fitz --collect-all docx --add-data "tessdata${{ matrix.sep }}tessdata" pdf2word_gui.py

      - name: Paketle (işletim sistemine göre .zip)
        shell: bash
        run: python -c "import shutil,os;shutil.make_archive('KitapDonusturucu-'+os.environ['RUNNER_OS'],'zip','dist')"

      - name: Yükle (her derlemede indirilebilir)
        uses: actions/upload-artifact@v4
        with:
          name: KitapDonusturucu-${{ runner.os }}
          path: KitapDonusturucu-*.zip

      - name: Sürüm etiketini belirle
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Releases'a ekle
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Kitap Dönüştürücü $TAG" \
            --notes "PDF'ten Word'e Kitap Dönüştürücü — indir, aç, kullan (kurulum yok).

          • Windows: KitapDonusturucu-Windows.zip indir, aç, KitapDonusturucu.exe'ye çift tıkla.
            (İlk açılışta 'Windows PC'nizi korudu' çıkarsa: Ek bilgi -> Yine de çalıştır.)
          • Mac: KitapDonusturucu-macOS.zip indir, aç, uygulamaya SAĞ TIKLA -> Aç.
          • Tamamen çevrimdışı çalışır; dosyalar bilgisayardan çıkmaz." \
            || true
          gh release upload "$TAG" KitapDonusturucu-*.zip --clobber
